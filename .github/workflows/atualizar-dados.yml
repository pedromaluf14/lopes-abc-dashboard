name: Atualizar dados do painel

on:
  schedule:
    - cron: "7 * * * *"   # a cada hora (minuto 7, UTC)
  workflow_dispatch:       # botão "Run workflow" para atualizar na hora

permissions:
  contents: write

concurrency:
  group: atualizar-dados
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Buscar dados no Windsor.ai
        env:
          WINDSOR_API_KEY: ${{ secrets.WINDSOR_API_KEY }}
        run: python scripts/fetch_windsor.py

      - name: Commitar data.json se mudou
        run: |
          git config user.name "painel-bot"
          git config user.email "painel-bot@users.noreply.github.com"
          git add metrics.json
          if git diff --cached --quiet; then
            echo "Sem mudanças nos dados."
          else
            git commit -m "Atualiza dados do Windsor.ai"
            git push
          fi
