<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel Lopes ABC</title>
<style>
  :root { --brand:#c2185b; --bg:#fafafa; --card:#fff; --text:#1d1d1f; --muted:#6b6b70; }
  @media (prefers-color-scheme: dark) { :root { --bg:#121214; --card:#1d1d20; --text:#f2f2f2; --muted:#a0a0a6; } }
  body { margin:0; font-family:system-ui,-apple-system,sans-serif; background:var(--bg); color:var(--text); }
  main { max-width:960px; margin:0 auto; padding:24px 16px; }
  h1 { font-size:1.4rem; margin:0 0 4px; border-left:4px solid var(--brand); padding-left:10px; }
  .meta { color:var(--muted); font-size:.85rem; margin-bottom:20px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; }
  .kpi { background:var(--card); border-radius:10px; padding:14px; box-shadow:0 1px 2px rgba(0,0,0,.08); }
  .kpi span { display:block; color:var(--muted); font-size:.8rem; }
  .kpi b { font-size:1.4rem; }
</style>
</head>
<body>
<main>
  <h1>Painel Lopes ABC — Meta Ads</h1>
  <div class="meta" id="meta">Carregando dados…</div>
  <div class="grid" id="kpis"></div>
</main>
<script>
const brl = v => v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const num = v => v.toLocaleString('pt-BR');
fetch('data.json?t=' + Date.now(), {cache:'no-store'})
  .then(r => r.json())
  .then(d => {
    const s = k => d.linhas.reduce((a,r) => a + (Number(r[k]) || 0), 0);
    const spend = s('spend'), leads = s('actions_lead'), imp = s('impressions'), clk = s('clicks');
    document.getElementById('meta').textContent =
      'Últimos 90 dias · atualizado em ' + new Date(d.atualizado_em).toLocaleString('pt-BR');
    document.getElementById('kpis').innerHTML = [
      ['Investimento', brl(spend)], ['Leads', num(leads)],
      ['CPL', leads ? brl(spend/leads) : '—'], ['Impressões', num(imp)],
      ['Cliques', num(clk)], ['CTR', imp ? (clk/imp*100).toFixed(2)+'%' : '—'],
    ].map(([l,v]) => `<div class="kpi"><span>${l}</span><b>${v}</b></div>`).join('');
  })
  .catch(() => { document.getElementById('meta').textContent = 'Dados ainda não disponíveis.'; });
</script>
</body>
</html>
